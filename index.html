<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#151922">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
	<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
	<link rel="manifest" href="site.webmanifest">
	<link rel="mask-icon" href="safari-pinned-tab.svg" color="#5bbad5">

    <link href="style.css" rel="stylesheet">

    <title>Start</title>

    <script src="links.js" defer></script>
    <script src="apps.js" defer></script>
</head>
<body>

<div class="page">

    <header class="header">
        <div>
            <h1>Welcome to the Web.</h1>
            <p class="subtitle">Your personal dashboard</p>
        </div>

        <div class="clock-container">
            <div id="clock">--:--:--</div>
            <div id="date">Loading date...</div>
        </div>
    </header>

    <section class="search-box">
        <form id="searchForm"
              action="https://www.google.com/search"
              method="get">

            <select id="searchEngine" aria-label="Search engine">
                <option value="google">Google</option>
                <option value="bing">Bing</option>
                <option value="duckduckgo">DuckDuckGo</option>
                <option value="startpage">Startpage</option>
                <option value="youtube">YouTube</option>
                <option value="imdb">IMDb</option>
            </select>

            <input
                type="text"
                name="q"
                id="searchInput"
                placeholder="Search the web..."
                autocomplete="off"
                autofocus
            >

            <button type="submit">Search</button>
        </form>
    </section>

    <main id="boxes"></main>

    <footer>Yossarian's Startpage</footer>

</div>

</body>
</html>
